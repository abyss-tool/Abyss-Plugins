name: Hub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 插件索引门禁
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate plugins.json
        run: |
          chmod +x tools/validate_hub.py
          python3 tools/validate_hub.py
