name: Hub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 插件索引门禁
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 同类缺陷防御（B-01/新增 Path 断裂）：门禁脚本先过语法编译，
      #    再跑业务校验 —— NameError 级缺陷不再能溜进 main
      - name: Python syntax pre-check (py_compile all tools)
        run: python3 -m py_compile tools/*.py

      # ── N-SEC-001 验签依赖：plugins.json.minisig 落地后（sync-index 补签
      #    成功），validate_hub.py 进入验签路径需要 pynacl —— 此前签名缺失
      #    该路径从未被执行，装依赖步骤一直缺位（被 B-02 修复暴露）
      - name: Install pynacl (signature verification)
        run: pip install --quiet pynacl

      - name: Validate plugins.json
        run: |
          chmod +x tools/validate_hub.py
          python3 tools/validate_hub.py
