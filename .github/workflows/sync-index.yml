name: Sync Index

# 插件中心索引聚合：从 13 个成员仓库（abyss-plugin-*）拉取 plugin.json /
# 补丁通道 / Release APK 资产 → 重新生成 plugins.json → 有变化则提交。
#
# 触发：
#   - workflow_dispatch（手动滚动，发布插件后立即聚合）
#   - schedule（每日 20:00 北京时间 = 12:00 UTC，兜底滚动）
#   - push 到 tools/（聚合器自身变更的自检）
#
# App 侧插件中心只读 plugins.json（单一事实源）—— 成员仓库的版本滚动与
# APK 发布经由本工作流自动汇入索引，无需手工维护。

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 12 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/sync_index.py'

concurrency:
  group: sync-index
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    name: Aggregate plugins.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pynacl (N-SEC-001 清单签名)
        run: pip install --quiet pynacl

      # ── N-SEC-001 清单签名材料（fail-closed：索引有变化而材料缺失 →
      # sync_index.py 拒绝滚动）。公钥与客户端 TRUSTED_KEYS / 主仓
      # ChannelSignatureVerifier.kt 同步（唯一事实源 = 主仓 Kotlin 源）。
      - name: Prepare manifest signing keys (N-SEC-001)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::缺少 RELEASE_SIGNING_KEY secret（raw Ed25519 seed base64 单行）—— N-SEC-001 清单签名强制"
            exit 1
          fi
          SIGNING_DIR="$RUNNER_TEMP/abyss-manifest-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$RELEASE_SIGNING_KEY" > "$SIGNING_DIR/seed.txt"
          cat > "$SIGNING_DIR/pubkey.txt" <<'PK'
          untrusted comment: Abyss-Tools manifest signing public key (meng4117222)
          RWRx16ORC4gsdxs6DsnctDYagiRptPX1NgFcVpQNYqh/BXGhPAHebh3B
          PK
          echo "SEED_FILE=$SIGNING_DIR/seed.txt" >> "$GITHUB_ENV"
          echo "PUBKEY_FILE=$SIGNING_DIR/pubkey.txt" >> "$GITHUB_ENV"

      - name: Aggregate index from member repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sync_index.py --seed-file "$SEED_FILE" --pubkey-file "$PUBKEY_FILE"

      - name: Validate aggregated index
        run: |
          chmod +x tools/validate_hub.py
          python3 tools/validate_hub.py

      - name: Commit & push (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json plugins.json.minisig 2>/dev/null || git add plugins.json
          if git diff --cached --quiet; then
            echo "[sync] 无变化，无需提交"
          else
            git commit -m "chore(index): 聚合成员仓库 → plugins.json 自动滚动（含 N-SEC-001 签名）[skip ci]"
            git push
            echo "[sync] ✓ 索引已提交（清单 + detached 签名原子入库）"
          fi
